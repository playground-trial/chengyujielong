<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联动级联成语接龙沙盒</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f1c40f;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-weight: 600;
        }

        .config-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: #f1f2f6;
            padding: 20px;
            border-radius: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            grid-column: 1 / -1;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #34495e;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .status-msg {
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            color: var(--accent-color);
            min-height: 20px;
        }

        .result-section {
            margin-top: 30px;
        }

        .result-title {
            font-size: 18px;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .tip-text {
            font-size: 13px;
            color: #718096;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .idiom-chain {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-start;
            max-width: 550px;
            margin: 0 auto;
        }

        .idiom-row {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .idiom-node {
            display: flex;
            align-items: center;
            background: #edf2f7;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .idiom-node.is-valid {
            border-color: var(--success-color);
            background: #e8f5e9;
        }

        .idiom-node.is-invalid {
            border-color: var(--accent-color);
            background: #ffebee;
        }

        .idiom-input {
            font-size: 18px;
            font-weight: bold;
            border: none;
            background: transparent;
            width: 120px;
            color: var(--primary-color);
            padding: 4px;
            border-bottom: 2px dashed #a0aec0;
            text-align: center;
        }

        .idiom-input:focus {
            outline: none;
            border-bottom-color: var(--primary-color);
        }

        .node-pinyin {
            font-size: 14px;
            color: #718096;
            margin-left: 15px;
            flex-grow: 1;
        }

        .action-btn {
            background: #3182ce;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 10px;
        }

        .action-btn:hover {
            background: #2b6cb0;
        }

        .arrow-v {
            text-align: center;
            color: #a0aec0;
            font-weight: bold;
            font-size: 20px;
            margin: 5px 0 5px 45px;
        }

        /* --- 弹窗样式 --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #a0aec0;
        }

        .close-btn:hover {
            color: #4a5568;
        }

        .modal-idiom {
            font-size: 28px;
            margin: 0 0 5px 0;
            color: var(--primary-color);
        }

        .modal-pinyin {
            font-size: 16px;
            color: #718096;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .info-block {
            margin-bottom: 15px;
        }

        .info-label {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 14px;
        }

        .info-text {
            font-size: 15px;
            line-height: 1.6;
            color: #4a5568;
        }
    </style>
    <script src="https://unpkg.com/pinyin-pro"></script>
</head>
<body>

<div class="container">
    <h1>中华成语接龙沙盒（智能联动版）</h1>
    
    <div class="config-section">
        <div class="form-group">
            <label for="startIdiom">起始成语：</label>
            <input type="text" id="startIdiom" placeholder="例如：胸有成竹" value="胸有成竹">
        </div>
        <div class="form-group">
            <label for="ruleSelect">接龙规则：</label>
            <select id="ruleSelect">
                <option value="1">规则一：字完全相同（首尾字字形相同）</option>
                <option value="2">规则二：读音相同（声母+韵母+声调完全相同）</option>
                <option value="3">规则三：同音异调（声母+韵母相同，声调可不同）</option>
            </select>
        </div>
        <div class="form-group">
            <label for="maxLen">最大接龙长度：</label>
            <input type="number" id="maxLen" value="6" min="2" max="50">
        </div>
        <button id="startBtn" disabled>正在加载成语词库，请稍候...</button>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="result-section">
        <div class="result-title">接龙运行链：</div>
        <div class="tip-text">
            🔗 <b>多米诺联动模式已开启：</b><br>
            当你修改其中某一个成语后（按回车或点击空白处），系统不仅会校验该词，还会<b>自动以此词为新起点，实时重新计算并刷新它后面所有的接龙成语</b>！
        </div>
        
        <div class="idiom-chain" id="resultChain">
            </div>
    </div>
</div>

<div class="modal-overlay" id="idiomModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <h2 class="modal-idiom" id="modalWord">成语</h2>
        <div class="modal-pinyin" id="modalPinyin">pīn yīn</div>
        
        <div class="info-block">
            <div class="info-label">【成语释义】</div>
            <div class="info-text" id="modalExplanation">暂无释义</div>
        </div>
        
        <div class="info-block">
            <div class="info-label">--【词源出处】--</div>
            <div class="info-text" id="modalDerivation">暂无出处</div>
        </div>
    </div>
</div>

<script>
    const IDIOM_DATA_URL = 'https://cdn.jsdelivr.net/gh/pwxcoo/chinese-xinhua@master/data/idiom.json';
    
    let idiomList = [];
    let idiomMap = {}; 
    let currentChain = []; // 全局维护当前的成语链条数组

    // 初始化：下载成语库
    async function initIdiomDatabase() {
        const btn = document.getElementById('startBtn');
        const status = document.getElementById('statusMsg');
        try {
            const response = await fetch(IDIOM_DATA_URL);
            const data = await response.json();
            
            idiomList = data.filter(item => item.word && item.word.length === 4);
            idiomList.forEach(item => { idiomMap[item.word] = item; });
            
            status.innerText = `成功加载 ${idiomList.length} 条四字成语！`;
            btn.innerText = "生成初始接龙";
            btn.disabled = false;
        } catch (error) {
            console.error(error);
            status.innerText = "成语库加载失败，请刷新页面重试。";
        }
    }

    // 利用 pinyin-pro 提取拼音核心特征
    function getPinyinInfo(char) {
        const withTone = pinyinPro.pinyin(char, { toneType: 'symbol' });
        const withoutTone = pinyinPro.pinyin(char, { toneType: 'none' });
        return { withTone, withoutTone };
    }

    // 核心算法：基于给定的已有集合生成接龙（增加 used 参数，防止与链条前半段重复）
    function generateSubChain(startWord, rule, remainLen, usedSet) {
        const used = new Set(usedSet);
        const subChain = [startWord];
        let currentWord = startWord;

        for (let i = 1; i < remainLen; i++) {
            const lastChar = currentWord.charAt(3);
            const lastCharPinyin = getPinyinInfo(lastChar);

            const nextIdiom = idiomList.find(item => {
                const word = item.word;
                if (used.has(word)) return false;
                const firstChar = word.charAt(0);

                if (rule === '1') return firstChar === lastChar;
                if (rule === '2') return getPinyinInfo(firstChar).withTone === lastCharPinyin.withTone;
                if (rule === '3') return getPinyinInfo(firstChar).withoutTone === lastCharPinyin.withoutTone;
                return false;
            });

            if (nextIdiom) {
                subChain.push(nextIdiom.word);
                used.add(nextIdiom.word);
                currentWord = nextIdiom.word;
            } else {
                break;
            }
        }
        return subChain;
    }

    // 【级联联动核心】修改某一层后触发的逻辑
    function handleNodeChange(index, inputElement) {
        const newWord = inputElement.value.trim();
        const rule = document.getElementById('ruleSelect').value;
        const maxLen = parseInt(document.getElementById('maxLen').value) || 6;
        const status = document.getElementById('statusMsg');

        // 1. 基础基础验证
        if (newWord.length !== 4) {
            status.innerText = `第 ${index + 1} 层的输入格式错误：必须是4个字`;
            renderChain(currentChain); // 恢复原状
            return;
        }

        if (!idiomMap[newWord]) {
            status.innerText = `“${newWord}”未在词库中找到，无法从该词发起联动接龙。`;
            renderChain(currentChain); // 恢复原状
            return;
        }

        // 2. 重新构建成语链条
        // 收集当前节点之前的所有成语，防止后半段与之重复
        const prevUsed = new Set();
        for (let i = 0; i < index; i++) {
            prevUsed.add(currentChain[i]);
        }
        prevUsed.add(newWord);

        // 计算剩余需要接龙的长度
        const remainLen = maxLen - index;

        // 生成从当前修改词开始的后续子链条
        const subChain = generateSubChain(newWord, rule, remainLen, prevUsed);

        // 将前半段和新生成的后半段剪切拼接
        const frontPart = currentChain.slice(0, index);
        currentChain = frontPart.concat(subChain);

        status.innerText = `第 ${index + 1} 层成语已修改，后续接龙已实时重算！`;
        
        // 3. 全局重新渲染
        renderChain(currentChain);
    }

    // 显示成语详情弹窗
    function showIdiomDetails(word) {
        const modal = document.getElementById('idiomModal');
        const info = idiomMap[word] || {};
        const py = pinyinPro.pinyin(word, { toneType: 'symbol' });

        document.getElementById('modalWord').innerText = word;
        document.getElementById('modalPinyin').innerText = py;
        document.getElementById('modalExplanation').innerText = info.explanation || "暂无详细释义";
        document.getElementById('modalDerivation').innerText = info.derivation || "暂无词源出处记载";

        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('idiomModal').classList.remove('active');
    }

    // 渲染链条至界面
    function renderChain(chain) {
        const container = document.getElementById('resultChain');
        container.innerHTML = '';

        if(chain.length === 0) return;

        chain.forEach((word, index) => {
            const row = document.createElement('div');
            row.className = 'idiom-row';
            const py = pinyinPro.pinyin(word, { toneType: 'symbol' });
            
            row.innerHTML = `
                <div class="idiom-node is-valid" id="node-${index}">
                    <input type="text" class="idiom-input" id="input-${index}" value="${word}" maxlength="4">
                    <span class="node-pinyin" id="pinyin-${index}">${py}</span>
                    <button class="action-btn" id="btn-${index}">查看详情</button>
                </div>
            `;
            container.appendChild(row);

            const inputEl = row.querySelector(`#input-${index}`);
            const btnEl = row.querySelector(`#btn-${index}`);

            // 详情按钮
            btnEl.onclick = () => showIdiomDetails(word);

            // 监听失去焦点和回车
            inputEl.addEventListener('blur', () => {
                // 只有当用户真的改了词，才触发联动，防止误触
                if (inputEl.value.trim() !== currentChain[index]) {
                    handleNodeChange(index, inputEl);
                }
            });
            inputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    inputEl.blur();
                }
            });

            // 垂直箭头
            if (index < chain.length - 1) {
                const arrow = document.createElement('div');
                arrow.className = 'arrow-v';
                arrow.innerText = '▼';
                container.appendChild(arrow);
            }
        });
    }

    // 生成按钮点击
    document.getElementById('startBtn').addEventListener('click', () => {
        const startWord = document.getElementById('startIdiom').value.trim();
        const rule = document.getElementById('ruleSelect').value;
        const maxLen = parseInt(document.getElementById('maxLen').value) || 6;
        const status = document.getElementById('statusMsg');

        if (startWord.length !== 4) {
            status.innerText = "请输入一个标准的四字成语！";
            return;
        }

        if (!idiomMap[startWord]) {
            status.innerText = "该起始词不在词库中，无法生成接龙。";
            return;
        }

        status.innerText = "接龙链初始化成功！";
        
        // 初始化全局链条
        currentChain = generateSubChain(startWord, rule, maxLen, new Set());
        renderChain(currentChain);
    });

    // 弹窗事件
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('idiomModal').addEventListener('click', (e) => {
        if(e.target.id === 'idiomModal') closeModal();
    });

    window.onload = initIdiomDatabase;
</script>

</body>
</html>
