<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成语接龙沙盒-智能终极精简版</title>
    <style>
        :root { --p: #2c3e50; --a: #e74c3c; --s: #2ecc71; }
        body { font-family: sans-serif; background: #f8f9fa; color: var(--p); padding: 20px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 550px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .cfg { display: flex; flex-wrap: wrap; gap: 8px; background: #f1f2f6; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; font-weight: bold; }
        .cfg input, .cfg select, button { padding: 6px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
        button { width: 100%; background: var(--p); color: #fff; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .node { display: flex; align-items: center; background: #edf2f7; padding: 6px 12px; border-radius: 8px; border: 2px solid transparent; margin: 6px 0; }
        .is-valid { border-color: var(--s); background: #e8f5e9; }
        .is-pending { border-color: #f1c40f; background: #fef9e7; }
        .idx { font-size: 11px; font-weight: bold; color: #fff; background: #718096; padding: 2px 5px; border-radius: 4px; margin-right: 8px; }
        .ipt { font-size: 15px; font-weight: bold; border: none; background: transparent; width: 90px; border-bottom: 2px dashed #a0aec0; text-align: center; }
        .ipt:focus { outline: none; border-bottom-color: var(--p); }
        .py { font-size: 12px; color: #718096; margin-left: 8px; flex-grow: 1; }
        .btn { background: #3182ce; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 1000; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-cnt { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; position: relative; }
    </style>
    <script src="https://unpkg.com/pinyin-pro"></script>
</head>
<body>

<div class="box">
    <h3 style="text-align:center; margin:0 0 10px 0;">成语接龙智能沙盒</h3>
    <div class="cfg">
        <div style="flex:1; display:flex; flex-direction:column;">起点：<input type="text" id="startW" value="胸有成竹"></div>
        <div style="flex:1; display:flex; flex-direction:column;">规则：<select id="rule"><option value="1">同字</option><option value="2">同音同调</option><option value="3">同音异调</option></select></div>
        <div style="flex:1; display:flex; flex-direction:column;">长：<input type="number" id="maxL" value="6" min="1"></div>
        <button id="startBtn" onclick="update(-1)" disabled>载入词库中...</button>
    </div>
    <div id="msg" style="text-align:center; font-weight:bold; color:var(--a); margin:8px 0; font-size:13px;"></div>
    <div id="chain"></div>
</div>

<div class="modal" id="md" onclick="if(event.target==this)this.classList.remove('active')">
    <div class="modal-cnt">
        <span style="position:absolute; top:8px; right:12px; cursor:pointer; color:#aaa; font-size:18px;" onclick="md.classList.remove('active')">&times;</span>
        <h3 id="mW" style="margin:0;color:var(--p)"></h3><div id="mP" style="color:#718096; font-size:13px; padding-bottom:5px; border-bottom:1px solid #eee;"></div>
        <h5 style="color:var(--a); margin:8px 0 2px 0;">【释义】</h5><div id="mE" style="font-size:13px; line-height:1.4;"></div>
        <h5 style="color:var(--a); margin:8px 0 2px 0;">【出处】</h5><div id="mD" style="font-size:13px; line-height:1.4;"></div>
    </div>
</div>

<script>
    let db = [], dbMap = {}, chain = [];
    
    // 初始化载入词库
    (async () => {
        try {
            db = (await (await fetch('https://cdn.jsdelivr.net/gh/pwxcoo/chinese-xinhua@master/data/idiom.json')).json()).filter(i => i.word?.length === 4);
            db.forEach(i => dbMap[i.word] = i);
            msg.innerText = `词库就绪，共 ${db.length} 条成语。`; startBtn.innerText = "生成最长接龙"; startBtn.disabled = false;
        } catch { msg.innerText = "词库加载失败！"; }
    })();

    const getPy = (w, i) => pinyinPro.pinyin(w.charAt(i), { toneType: 'symbol' });
    const getPyNoT = (w, i) => pinyinPro.pinyin(w.charAt(i), { toneType: 'none' });
    
    // 核心规则验证器
    const match = (p, c, r) => !p ? true : (r === '1' ? p.charAt(3) === c.charAt(0) : (r === '2' ? getPy(p,3) === getPy(c,0) : getPyNoT(p,3) === getPyNoT(c,0)));

    // DFS回溯寻优：寻找尽可能长的路径
    function dfsSearch(start, r, targetLen, used) {
        let best = [];
        const curr = [start], vis = new Set(used).add(start);
        (function dfs(w) {
            if (curr.length >= targetLen) return best = [...curr], true;
            if (curr.length > best.length) best = [...curr];
            for (const cand of db.filter(i => !vis.has(i.word) && match(w, i.word, r))) {
                vis.add(cand.word); curr.push(cand.word);
                if (dfs(cand.word)) return true;
                curr.pop(); vis.delete(cand.word);
            }
        })(start);
        return best;
    }

    // 三合一核心控制器：处理开局(-1)、中间修改(0到N-1)、末尾追加(N)
    function update(idx, el) {
        const r = rule.value, tLen = parseInt(maxL.value) || 5;
        if (idx === -1) { // 1. 开局初始化
            if (!dbMap[startW.value.trim()]) return msg.innerText = "起点词不在词库中！";
            chain = dfsSearch(startW.value.trim(), r, tLen, []);
            msg.innerText = chain.length < tLen ? `受词库限制，当前最长仅能接 ${chain.length} 层。` : "完美补齐期望长度！";
        } else { // 2. 输入框变动处理
            const val = el.value.trim();
            if (!val || val === chain[idx]) return;
            if (val.length !== 4 || !dbMap[val] || !match(chain[idx-1], val, r) || chain.slice(0, idx).includes(val)) {
                return msg.innerText = "不符规则、重复或非标准成语！", render();
            }
            if (idx === chain.length) { // 末尾玩家追加
                chain.push(val); msg.innerText = "手动作答正确！追加成功。";
            } else { // 中间层修改：级联重新寻优
                chain = chain.slice(0, idx).concat(dfsSearch(val, r, Math.max(1, tLen - idx), chain.slice(0, idx)));
                msg.innerText = "中间层微调成功，后续链条已智能重算！";
            }
        }
        render();
        if (idx >= chain.length - 1) setTimeout(() => document.getElementById('ipt-app')?.focus(), 50); // 自动聚焦
    }

    function showModal(w) {
        if (!dbMap[w]) return;
        mW.innerText = w; mP.innerText = pinyinPro.pinyin(w);
        mE.innerText = dbMap[w].explanation || "暂无"; mD.innerText = dbMap[w].derivation || "暂无";
        md.classList.add('active');
    }

    function render() {
        let h = '';
        chain.forEach((w, i) => h += `
            <div class="node is-valid">
                <span class="idx">${i + 1}</span>
                <input class="ipt" value="${w}" onchange="update(${i}, this)" onkeydown="if(event.key==='Enter')this.blur()" maxlength="4">
                <span class="py">${pinyinPro.pinyin(w)}</span>
                <button class="btn" onclick="showModal('${w}')">详情</button>
            </div><div style="text-align:center;color:#a0aec0;font-size:12px;margin:-3px 0">▼</div>`);
        chain.innerHTML = h + `
            <div class="node is-pending">
                <span class="idx" style="background:#f1c40f">${chain.length + 1}</span>
                <input class="ipt" id="ipt-app" placeholder="输入接龙..." onchange="update(${chain.length}, this)" onkeydown="if(event.key==='Enter')this.blur()" maxlength="4">
                <span class="py" style="color:#d4ac0d; font-style:italic;">✍️ 等待挑战...</span>
            </div>`;
    }
</script>
</body>
</html>
