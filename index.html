<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成语接龙自适应沙盒</title>
    <style>
        :root { --p-color: #2c3e50; --a-color: #e74c3c; --s-color: #2ecc71; }
        body { font-family: sans-serif; background: #f8f9fa; color: var(--p-color); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .config-section { display: flex; flex-wrap: wrap; gap: 10px; background: #f1f2f6; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 120px; display: flex; flex-direction: column; font-size: 13px; font-weight: bold; }
        .form-group input, .form-group select, button { padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { width: 100%; background: var(--p-color); color: #fff; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status-msg { text-align: center; font-weight: bold; color: var(--a-color); margin: 10px 0; font-size: 14px; }
        .idiom-node { display: flex; align-items: center; background: #edf2f7; padding: 8px 12px; border-radius: 8px; border: 2px solid transparent; margin: 8px 0; }
        .is-valid { border-color: var(--s-color); background: #e8f5e9; }
        .is-pending { border-color: #f1c40f; background: #fef9e7; }
        .idiom-index { font-size: 12px; font-weight: bold; color: #fff; background: #718096; padding: 2px 6px; border-radius: 4px; margin-right: 10px; }
        .idiom-input { font-size: 16px; font-weight: bold; border: none; background: transparent; width: 100px; border-bottom: 2px dashed #a0aec0; text-align: center; }
        .idiom-input:focus { outline: none; border-bottom-color: var(--p-color); }
        .node-pinyin { font-size: 13px; color: #718096; margin-left: 10px; flex-grow: 1; }
        .action-btn { background: #3182ce; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .arrow { text-align: center; color: #a0aec0; font-size: 14px; margin: 2px 0; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 1000; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; color: #aaa; }
        .info-label { font-weight: bold; color: var(--a-color); margin-top: 10px; font-size: 13px; }
    </style>
    <script src="https://unpkg.com/pinyin-pro"></script>
</head>
<body>

<div class="container">
    <h3 style="text-align: center; margin-top:0;">中华成语接龙沙盒</h3>
    <div class="config-section">
        <div class="form-group">起点：<input type="text" id="startIdiom" value="胸有成竹"></div>
        <div class="form-group">规则：
            <select id="ruleSelect">
                <option value="1">同字</option><option value="2">同音同调</option><option value="3">同音异调</option>
            </select>
        </div>
        <div class="form-group">期望链条总长：<input type="number" id="maxLen" value="5" min="1"></div>
        <button id="startBtn" onclick="initGame()" disabled>正在加载词库...</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
    <div id="resultChain"></div>
</div>

<div class="modal-overlay" id="idiomModal" onclick="if(event.target==this)toggleModal(false)">
    <div class="modal-content">
        <span class="close-btn" onclick="toggleModal(false)">&times;</span>
        <h2 id="mWord" style="margin:0;color:var(--p-color)"></h2>
        <div id="mPinyin" style="color:#718096; border-bottom:1px solid #e2e8f0; padding-bottom:5px;"></div>
        <div class="info-label">【释义】</div><div id="mExp" style="font-size:14px; line-height:1.5;"></div>
        <div class="info-label">【出处】</div><div id="mDer" style="font-size:14px; line-height:1.5;"></div>
    </div>
</div>

<script>
    let idiomList = [], idiomMap = {}, currentChain = [];

    // 初始化词库
    (async function() {
        try {
            const res = await fetch('https://cdn.jsdelivr.net/gh/pwxcoo/chinese-xinhua@master/data/idiom.json');
            idiomList = (await res.json()).filter(i => i.word?.length === 4);
            idiomList.forEach(i => idiomMap[i.word] = i);
            document.getElementById('statusMsg').innerText = `词库加载成功，共 ${idiomList.length} 条。`;
            document.getElementById('startBtn').innerText = "开始游戏";
            document.getElementById('startBtn').disabled = false;
        } catch { document.getElementById('statusMsg').innerText = "词库加载失败，请刷新。"; }
    })();

    const getPy = char => ({ withT: pinyinPro.pinyin(char, { toneType: 'symbol' }), noT: pinyinPro.pinyin(char, { toneType: 'none' }) });

    // 规则校验
    function checkRule(prev, curr, rule) {
        if (!prev) return true;
        const p = getPy(prev.charAt(3)), c = getPy(curr.charAt(0));
        return rule === '1' ? prev.charAt(3) === curr.charAt(0) : (rule === '2' ? p.withT === c.withT : p.noT === c.noT);
    }

    // 核心接龙生成器
    function genChain(start, rule, targetLen, used) {
        const sub = [start], uSet = new Set(used).add(start);
        while (sub.length < targetLen) {
            const last = sub[sub.length - 1];
            const next = idiomList.find(i => !uSet.has(i.word) && checkRule(last, i.word, rule));
            if (!next) break;
            sub.push(next.word); uSet.add(next.word);
        }
        return sub;
    }

    // 处理输入修改与级联长度自适应
    function handleInputChange(idx, inputEl) {
        const word = inputEl.value.trim(), rule = document.getElementById('ruleSelect').value, status = document.getElementById('statusMsg');
        const targetTotalLen = parseInt(document.getElementById('maxLen').value) || 5; // 实时获取指定的最新期望长度
        if (!word) return;

        // 基础格式与规则防错校验
        if (word.length !== 4 || !idiomMap[word] || (idx > 0 && !checkRule(currentChain[idx - 1], word, rule)) || currentChain.slice(0, idx).includes(word)) {
            status.innerText = `输入错误或不符规则！`;
            return render();
        }

        const prevUsed = currentChain.slice(0, idx);
        
        if (idx === currentChain.length) { 
            // 1. 最底层手动追加一行
            currentChain.push(word);
            status.innerText = "追加成功！";
            render();
            setTimeout(() => document.getElementById('input-append')?.focus(), 50);
        } else { 
            // 2. 中间层修改：根据最新指定的“期望总长”，动态计算后面还需要补全多少个成语
            const remainLen = Math.max(1, targetTotalLen - idx); 
            currentChain = prevUsed.concat(genChain(word, rule, remainLen, prevUsed));
            status.innerText = `微调成功！后续接龙已自动匹配并重算至指定的 ${currentChain.length} 层。`;
            render();
        }
    }

    function toggleModal(show, word = '') {
        const m = document.getElementById('idiomModal');
        m.classList.toggle('active', show);
        if (show && idiomMap[word]) {
            document.getElementById('mWord').innerText = word;
            document.getElementById('mPinyin').innerText = pinyinPro.pinyin(word);
            document.getElementById('mExp').innerText = idiomMap[word].explanation || "暂无";
            document.getElementById('mDer').innerText = idiomMap[word].derivation || "暂无";
        }
    }

    function render() {
        let html = '';
        currentChain.forEach((word, i) => {
            html += `
                <div class="idiom-node is-valid">
                    <span class="idiom-index">${i + 1}</span>
                    <input class="idiom-input" value="${word}" onchange="handleInputChange(${i}, this)" onkeydown="if(event.key==='Enter')this.blur()" maxlength="4">
                    <span class="node-pinyin">${pinyinPro.pinyin(word)}</span>
                    <button class="action-btn" onclick="toggleModal(true, '${word}')">详情</button>
                </div><div class="arrow">▼</div>`;
        });
        html += `
            <div class="idiom-node is-pending">
                <span class="idiom-index" style="background:#f1c40f">${currentChain.length + 1}</span>
                <input class="idiom-input" id="input-append" placeholder="输入接龙..." onchange="handleInputChange(${currentChain.length}, this)" onkeydown="if(event.key==='Enter')this.blur()" maxlength="4">
                <span class="node-pinyin" style="color:#d4ac0d; font-style:italic;">✍️ 等待输入...</span>
            </div>`;
        document.getElementById('resultChain').innerHTML = html;
    }

    function initGame() {
        const start = document.getElementById('startIdiom').value.trim(), len = parseInt(document.getElementById('maxLen').value) || 5, rule = document.getElementById('ruleSelect').value;
        if (!idiomMap[start]) return document.getElementById('statusMsg').innerText = "起点词不在词库中！";
        currentChain = genChain(start, rule, len, []);
        render();
    }
</script>
</body>
</html>
